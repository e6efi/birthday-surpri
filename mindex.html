<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 مفاجأة</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(180deg,#050816,#090f2f,#1d1145);
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
position:relative;
}

#stars{
position:fixed;
width:100%;
height:100%;
left:0;
top:0;
overflow:hidden;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{
opacity:.2;
transform:scale(.6);
}
to{
opacity:1;
transform:scale(1.4);
}
}

.card{
position:relative;
z-index:5;
text-align:center;
padding:40px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
border-radius:25px;
box-shadow:0 0 40px rgba(255,255,255,.15);
}

h1{
font-size:42px;
margin-bottom:20px;
animation:float 3s infinite ease-in-out;
}

p{
font-size:20px;
opacity:.9;
margin-bottom:30px;
}

button{
padding:18px 40px;
font-size:22px;
border:none;
border-radius:50px;
cursor:pointer;
background:#ff4d88;
color:white;
transition:.3s;
}

button:hover{
transform:scale(1.1);
background:#ff2f74;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}
</style>
</head>

<body>

<div id="stars"></div>

<div class="card">
<h1>🎁 مفاجأة بانتظارك</h1>

<p>اضغط الزر لتبدأ الرحلة...</p>

<button id="start">
ابدأ
</button>

</div>

<script>

for(let i=0;i<220;i++){

let s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"vw";

s.style.top=Math.random()*100+"vh";

s.style.animationDelay=Math.random()*3+"s";

document.getElementById("stars").appendChild(s);

}

document.getElementById("start").onclick=function(){

alert(const card = document.querySelector(".card");

document.getElementById("start").onclick = function () {

card.innerHTML = `

<h1 style="margin-bottom:25px;">🎁 هديتك وصلت</h1>

<div id="gift">

<div id="lid"></div>

<div id="box"></div>

<div id="ribbonV"></div>

<div id="ribbonH"></div>

</div>

<p style="margin-top:25px;font-size:20px;">
اضغط على الهدية
</p>

<div id="message"></div>

`;

const style = document.createElement("style");

style.innerHTML = `

#gift{

width:170px;

height:170px;

margin:auto;

position:relative;

cursor:pointer;

animation:giftMove 2s infinite;

}

#box{

position:absolute;

bottom:0;

width:170px;

height:120px;

background:#ff4f81;

border-radius:0 0 18px 18px;

}

#lid{

position:absolute;

top:20px;

left:-5px;

width:180px;

height:35px;

background:#ff7aa5;

border-radius:10px;

transition:1s;

transform-origin:left center;

}

#ribbonV{

position:absolute;

left:75px;

width:20px;

height:170px;

background:#ffd54f;

}

#ribbonH{

position:absolute;

top:58px;

width:170px;

height:20px;

background:#ffd54f;

}

@keyframes giftMove{

0%{transform:translateY(0px);}
50%{transform:translateY(-8px);}
100%{transform:translateY(0px);}

}

.open #lid{

transform:rotate(-120deg);

}

#message{

margin-top:25px;

font-size:22px;

line-height:2;

white-space:pre-wrap;

}

`;

document.head.appendChild(style);

const gift = document.getElementById("gift");

gift.onclick = function(){

gift.classList.add("open");

setTimeout(showMessage,900);

};

};

function showMessage(){

const text=`🎉 عيد ميلاد سعيد 🎉

أتمنى لك أيامًا مليئة بالسعادة
والنجاح وتحقيق كل أحلامك.

❤️ كل عام وأنت بألف خير ❤️`;

let i=0;

const msg=document.getElementById("message");

msg.innerHTML="";

const timer=setInterval(()=>{

msg.innerHTML+=text.charAt(i);

i++;

if(i>=text.length){

clearInterval(timer);

}

},45);

});

}

</script>

</body>
</html>
